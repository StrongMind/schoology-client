name: Publish Gem

on: 
  workflow_dispatch:

# Inlined from the org shared reusable workflow publish-gem.yml (DEVOPS-16435).

permissions:
  contents: read

jobs:
  bundle-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.1.4'
      - run: bundle install
      - run: bundle exec rspec

  publish-gem:
    needs: bundle-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Publish to RubyGems
        run: |
          mkdir -p "$HOME/.gem"
          touch "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          printf -- "---\n:rubygems_api_key: %s\n" "${GEM_HOST_API_KEY}" > "$HOME/.gem/credentials"
          gem build ./*.gemspec
          gem push ./*.gem
        env:
          GEM_HOST_API_KEY: "${{secrets.RUBYGEMS_API_KEY}}"
