name: Dependabot Pull Request Approve and Merge

# Inlined from the org shared reusable workflow shared-dependabot-auto-merge.yml (DEVOPS-16435).
# Runs under pull_request_target, so it must never check out or execute PR code.

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request_target:
    branches:
      - 'main'
      - 'master'
    types: [opened, synchronize]

permissions: {}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Gate on the PR author (not github.actor). Skip github_actions ecosystem
    # updates so action bumps always get a human review.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@a3e5f86ae9f2f49b441498973ddec20035d326b8 # v1.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Here the PR gets approved.
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Finally, this sets the PR to allow auto-merging for patch and minor
      # updates if all checks pass
      - name: Enable auto-merge for Dependabot PRs
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: gh pr merge --merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
